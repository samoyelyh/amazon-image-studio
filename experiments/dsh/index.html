<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 独立实验</title>
<style>body{font:16px system-ui;background:#f4f5f7;color:#17212d;margin:0}main{max-width:1000px;margin:32px auto;padding:24px}section{background:white;padding:20px;margin:16px 0;border-radius:12px}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #c9d0d8;border-radius:6px;margin:4px}textarea{display:block;width:95%;min-height:90px}button{background:#194fbd;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:500px;overflow:auto}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.muted{color:#596776}a{color:#194fbd}</style>
<main><h1>DSH 任务管理实验</h1><p class="muted">官方 DSH Engine + 原生 Main / Executor Sessions · 隔离数据库与 Redis · 每类接口最多 50 次</p><p id="budget" role="status"></p>
<section><div class="row"><input id="account" value="dsh-admin" aria-label="账号"><input id="password" type="password" placeholder="实验密码"><button id="login">登录实验账号</button><span id="identity"></span></div></section>
<section><div class="row"><label>主控 <select id="controller"><option value="dsh">DSH 原生 Sessions</option><option value="langgraph">原 LangGraph</option></select></label><label>会话 <input id="session" value="local-comparison"></label><label>模式 <select id="mode"><option value="auto">自动归属</option><option value="chat">仅聊天</option><option value="task">新任务</option><option value="continue">继续当前任务</option><option value="status">查看进度</option><option value="stop">停止后续执行</option></select></label></div><div class="row"><label>目标任务 <select id="ticket"><option value="">当前焦点任务</option></select></label><button id="refresh">刷新任务</button></div><textarea id="text" placeholder="普通问题仅回答；明确任务进入 Ticket。多任务可从上方切换。"></textarea><details><summary>现有素材、模块与父图片引用</summary><textarea id="selection" placeholder='{"attachment_ids":[],"parent_output_id":null,"amazon_plan_id":null,"amazon_module_ids":["m2"]}'>{}</textarea></details><button id="send">发送</button><input id="file" type="file" accept="image/*"><button id="upload">上传到当前任务</button><p id="status"></p></section>
<section><label>本轮明确确认的商品事实（可选；未知内容写“未知”）<textarea id="facts" placeholder="调研后请核对我方商品事实。竞品信息不会自动成为我方商品事实。"></textarea></label></section>
<section><h2>回复与执行回执</h2><button id="restore">恢复选中任务</button><button id="archive">下载当前 A+ 套图 ZIP</button><div id="answer"></div><div id="images"></div><pre id="receipt"></pre></section><section><h2>独立任务</h2><pre id="tasks"></pre></section></main>
<script type="module">
const $=id=>document.getElementById(id);let token='',current=null,timer=null,stagedAssets=[];
$('session').value=sessionStorage.getItem('dsh-experiment-session')||'local-comparison';$('session').oninput=$('session').onchange=()=>sessionStorage.setItem('dsh-experiment-session',$('session').value);
async function api(path,body,method=body?'POST':'GET'){const r=await fetch('/api/v1'+path,{method,headers:{...(body instanceof FormData?{}:{'content-type':'application/json'}),...(token?{Authorization:'Bearer '+token}:{})},body:body?(body instanceof FormData?body:JSON.stringify(body)):undefined});const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data));return data}
function showError(e){$('status').textContent=e.message}
$('login').onclick=async()=>{try{const r=await api('/auth/login',{account:$('account').value,password:$('password').value});token=r.access_token;$('password').value='';$('identity').textContent='已登录隔离环境';await refresh()}catch(e){showError(e)}};
async function refresh(){const rows=await api('/experiment/tickets?session='+encodeURIComponent($('session').value));$('tasks').textContent=JSON.stringify(rows,null,2);const selected=$('ticket').value;$('ticket').replaceChildren(new Option('当前焦点任务',''),...rows.map(t=>new Option(t.title+' · '+t.stage.stage,t.id)));$('ticket').value=selected;try{const m=await api('/experiment/metrics'),used=m.calls.filter(c=>c.kind==='text'&&c.state!=='not_sent').length;$('budget').textContent=used>=m.limit_per_kind?'本轮文本测试额度已用完；可继续恢复、预览和下载既有结果。':`文本测试已使用 ${used}/${m.limit_per_kind} 次`}catch{}return rows}
$('refresh').onclick=()=>refresh().catch(showError);
async function render(r){current=r;$('receipt').textContent=JSON.stringify(r,null,2);const latest=r.native?.events?.at(-1);$('status').textContent=[r.state,latest?.name||latest?.type,r.run?.jobs?`${r.run.jobs.filter(j=>j.status==='succeeded').length}/${r.run.jobs.length} 图片完成`:''].filter(Boolean).join(' · ');$('answer').textContent=r.answer||r.run?.plan?.summary||r.message||r.state||r.route;$('images').replaceChildren();for(const o of r.run?.outputs||[]){const response=await fetch(o.download_url,{headers:{Authorization:'Bearer '+token}});if(response.ok){const blob=await response.blob(),url=URL.createObjectURL(blob);const img=document.createElement('img');img.src=url;img.style.maxWidth='280px';const a=document.createElement('a');a.href=url;a.download=o.filename||'image.png';a.append(img);$('images').append(a)}}await refresh()}
$('send').onclick=async()=>{try{clearInterval(timer);const request=crypto.randomUUID(),selection=JSON.parse($('selection').value||'{}'),asset_ids=[...new Set([...stagedAssets,...(selection.asset_ids||[])])];delete selection.asset_ids;const r=await api('/experiment/messages',{session:$('session').value,request,text:$('text').value,controller:$('controller').value,mode:$('mode').value,ticket:$('ticket').value||null,new_task:$('mode').value==='task',selection,asset_ids,confirmed_facts:$('facts').value.trim()?{statement:$('facts').value.trim()}:null});stagedAssets=[];$('facts').value='';await render(r);$('status').textContent='已接收。任务可并行，刷新后继续读取。';if(r.request){timer=setInterval(async()=>{try{const p=await api('/experiment/turns/'+request+'?session='+encodeURIComponent($('session').value));await render(p);if(['completed','succeeded','failed','remote_unknown','blocked','needs_input','awaiting_clarification','awaiting_review','awaiting_confirmation','cancelled'].includes(p.state))clearInterval(timer)}catch(e){clearInterval(timer);showError(e)}},1500)}}catch(e){showError(e)}};
$('upload').onclick=async()=>{try{const f=$('file').files[0];if(!f)throw Error('请选择图片');const body=new FormData();body.append('file',f);body.append('category','product_reference');const asset=await api('/assets',body);stagedAssets.push(asset.id);$('status').textContent='已暂存 '+stagedAssets.length+' 张参考图，下次发送时绑定到目标任务'}catch(e){showError(e)}};
$('restore').onclick=async()=>{sessionStorage.setItem('dsh-experiment-session',$('session').value);try{if($('controller').value==='dsh'){await render(await api('/experiment/native/latest?session='+encodeURIComponent($('session').value)));return}const tasks=await refresh(),t=tasks.find(t=>t.id===$('ticket').value)||tasks.at(-1);if(!t?.platform?.conversation)throw Error('当前没有可恢复的任务');const c=await api('/agent/conversations/'+t.platform.conversation),r=c.runs[0];await render({conversation:c.id||t.platform.conversation,ticket:t.id,state:r?.status,run:r})}catch(e){showError(e)}};
$('archive').onclick=async()=>{try{const plan=current?.run?.outputs?.find(o=>o.amazon_module?.plan_id)?.amazon_module?.plan_id;if(!plan)throw Error('当前结果没有可下载的 A+ 方案');const r=await fetch('/api/v1/agent/conversations/'+current.conversation+'/amazon-plans/'+plan+'/archive',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('ZIP 下载失败：'+r.status);const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='aplus-'+plan+'.zip';a.click()}catch(e){showError(e)}};
const sendHandler=$('send').onclick;
$('send').onclick=async()=>{if($('send').disabled)return;$('send').disabled=true;try{await sendHandler()}finally{$('send').disabled=false}};
(async()=>{try{const r=await api('/auth/refresh',{});token=r.access_token;$('identity').textContent='已恢复隔离环境登录';await refresh();try{await render(await api('/experiment/native/latest?session='+encodeURIComponent($('session').value)))}catch{}}catch{}})();
</script></html>
